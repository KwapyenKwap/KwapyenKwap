  <circle cx="74" cy="30" r="5" fill="#34d399"/>
  <text x="103" y="35" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">kwapyen / profile.readme</text>
  <line x1="24" y1="56" x2="1256" y2="56" stroke="#20344d"/>

