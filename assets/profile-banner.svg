<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Kwapyen Kevin Kwap — Training Manager and Software Builder</title>
  <desc id="desc">Dark terminal-inspired profile banner describing a builder of training, productivity, coaching, and team coordination systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#071623"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#17304a" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1280" height="560" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="558" rx="19" fill="none" stroke="#20344d" stroke-width="2"/>

